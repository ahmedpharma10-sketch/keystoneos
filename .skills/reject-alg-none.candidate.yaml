trigger:
  error_fingerprint_like: "InvalidToken*alg*none"
  language: python
summary: >
  Reject JWTs presenting alg=none (and malformed tokens) in verify_token().
diff_template: |
  - return jwt.decode(token, KEY, algorithms=[header["alg"]])
  + if header.get("alg", "").lower() == "none":
  +     raise InvalidToken("unsigned tokens are rejected")
  + return jwt.decode(token, KEY, algorithms=["HS256"])
